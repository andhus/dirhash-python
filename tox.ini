[tox]
requires =
    tox>=4.2
env_list =
    pre-commit
    py{314, 313, 312, 311, 310, 39, 38}

[testenv]
deps =
    pytest
    pytest-cov
set_env =
    COVERAGE_FILE = {env_dir}/.coverage
commands =
    pytest {posargs:tests}

[testenv:pre-commit]
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files --show-diff-on-failure

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
